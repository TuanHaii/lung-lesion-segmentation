experiment:
  id: EXP-UNET-001
  description: Training Standard U-Net Baseline with AdamW and CosineAnnealingLR
data:
  image_size:
  - 256
  - 256
  batch_size: 16
  num_workers: 2
  pin_memory: true
model:
  name: UNet
  in_channels: 1
  out_channels: 1
  features:
  - 64
  - 128
  - 256
  - 512
training:
  epochs: 50
  early_stopping_patience: 15
  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.01
  scheduler:
    name: CosineAnnealingLR
    T_max: 50
    eta_min: 1.0e-06
  loss:
    alpha_bce: 0.5
    beta_dice: 0.5
    smooth_epsilon: 1.0e-05
  seed: 2026
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
