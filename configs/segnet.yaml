experiment:
  id: "EXP-SEGNET-001"
  description: "Training SegNet Baseline with AdamW and CosineAnnealingLR"

data:
  image_size: [256, 256]
  batch_size: 16
  num_workers: 2
  pin_memory: true

model:
  name: "SegNet"
  in_channels: 1
  out_channels: 1
  init_features: 32

training:
  epochs: 50
  early_stopping_patience: 15
  optimizer:
    name: "AdamW"
    lr: 0.0001
    weight_decay: 0.01
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 50
    eta_min: 0.000001
  loss:
    alpha_bce: 0.5
    beta_dice: 0.5
    smooth_epsilon: 0.00001

paths:
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"
