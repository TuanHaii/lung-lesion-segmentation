experiment:
  id: EXP-ATTUNET-001
  description: Training Attention U-Net with AdamW and CosineAnnealingLR
data:
  image_size:
  - 256
  - 256
  batch_size: 16
  num_workers: 4
  pin_memory: true
  lesion_label: 1
model:
  name: AttentionUNet
  in_channels: 1
  out_channels: 1
training:
  epochs: 100
  early_stopping_patience: 15
  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.01
  scheduler:
    name: CosineAnnealingLR
    T_max: 100
    eta_min: 1.0e-06
  loss:
    alpha_bce: 0.5
    beta_dice: 0.5
    smooth_epsilon: 1.0e-05
  seed: 2026
paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
